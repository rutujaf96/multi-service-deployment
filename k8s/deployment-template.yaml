apiVersion: apps/v1
kind: Deployment
metadata:
  name: ${MICROSERVICE}
  namespace: ${NAMESPACE}
spec:
  replicas: ${REPLICAS}
  selector:
    matchLabels:
      app: ${MICROSERVICE}
  template:
    metadata:
      labels:
        app: ${MICROSERVICE}
    spec:
      containers:
        - name: ${MICROSERVICE}
          image: ${IMAGE}
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ${MICROSERVICE}
  namespace: ${NAMESPACE}
spec:
  selector:
    app: ${MICROSERVICE}
  ports:
    - port: 80
      targetPort: 8080
  type: ClusterIP
